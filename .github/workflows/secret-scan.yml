name: Secret Scanning

on:
  push:
    branches: [main, dev/fintrack-v2, feature/**, fix/**]
  pull_request:
    branches: [main, dev/fintrack-v2]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@e85a6a3b680786cf8c1f964042ea04ab575b5b16 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
