# FinTrack Personal Finance Cockpit — Private Local PostgreSQL 17 Setup
# Secure, localhost-only persistent database service for local development and private E2E runs.
#
# SECURITY RULES:
# - Binds exclusively to IPv4 loopback (127.0.0.1) to prevent external network exposure.
# - Uses environment variable substitution; NEVER hardcode production secrets here.
# - Configurable via .env.local or shell variables.

services:
  postgres:
    image: postgres:17.4-alpine
    container_name: fintrack-cockpit-pg
    restart: unless-stopped
    ports:
      # Strictly bind to 127.0.0.1 to avoid exposing the database port publicly
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
    volumes:
      - fintrack_cockpit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-personal_finance}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  fintrack_cockpit_pgdata:
    name: fintrack_cockpit_pgdata
